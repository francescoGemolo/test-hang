<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/details.css">
    <title>Dettagli Evento</title>
</head>

<body>
    <div class="app-details">
        <header class="header-back">
            <a href="events.html" class="btn-back" aria-label="Torna agli eventi">
                <i class="hgi hgi-stroke hgi-rounded hgi-arrow-left-01"></i>
            </a>
        </header>
        <main class="wrapper">
            <h1 class="page-title">Aperitivo Serale</h1>
            <article class="info-card">
                <div class="info-list">
                    <div class="info-item">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Sab. 12 luglio</p>
                    </div>
                    <div class="info-item">
                        <i class="hgi hgi-stroke hgi-rounded hgi-clock-01"></i>
                        <p>19:30</p>
                    </div>
                    <div class="info-item">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Bar Mediterraneo</p>
                    </div>
                    <div class="info-item">
                        <i class="hgi hgi-stroke hgi-rounded hgi-user-group"></i>
                        <p>2 / 10 partecipanti</p>
                    </div>
                </div>
                <div class="description">
                    <p>Apericucciole con le cucciole.</p>
                </div>
            </article>
            <button class="btn-primary">Partecipa</button>
            <section class="participants-section">
                <h2 class="section-title">Partecipanti (2)</h2>
                <article class="participant">
                    <div class="avatar-circle">M</div>
                    <div class="participant-content">
                        <div class="participant-header">
                            <h3>Marco</h3>
                            <p>- Organizzatore</p>
                        </div>
                        <div class="participant-links">
                            <a href="#" class="badge-link badge-whatsapp">
                                <i class="hgi hgi-stroke hgi-rounded hgi-whatsapp"></i>
                                +39 333 1234567
                            </a>
                            <a href="#" class="badge-link badge-instagram">
                                <i class="hgi hgi-stroke hgi-rounded hgi-instagram"></i>
                                marco_roma
                            </a>
                        </div>
                    </div>
                </article>
                <article class="participant">
                    <div class="avatar-circle">G</div>
                    <div class="participant-content">
                        <div class="participant-header">
                            <h3>Giulia</h3>
                        </div>
                        <div class="participant-links">
                            <a href="#" class="badge-link badge-instagram">
                                <i class="hgi hgi-stroke hgi-rounded hgi-instagram"></i>
                                giulia.foto
                            </a>
                            <a href="#" class="badge-link badge-telegram">
                                <i class="hgi hgi-stroke hgi-rounded hgi-telegram"></i>
                                giulia_tg
                            </a>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>

</html>
