<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/create-event.css">
    <title>Crea Evento</title>
</head>

<body>
    <div class="app-create-event">
        <header class="header-back">
            <a href="events.html" class="btn-back" aria-label="Torna agli eventi">
                <i class="hgi hgi-stroke hgi-rounded hgi-arrow-left-01"></i>
            </a>
            <h1>Crea Evento</h1>
        </header>
        <form class="form" id="createEventForm" onsubmit="return false;">
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-note-01"></i>
                    </div>
                    <label for="event-title">Titolo dell'evento *</label>
                </div>
                <input type="text" id="event-title" placeholder="es. Aperitivo Serale">
                <span class="field-error" id="event-title-error">Inserisci un titolo per l'evento.</span>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <div class="label-group">
                        <div class="label-icon">
                            <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        </div>
                        <label for="event-date">Data *</label>
                    </div>
                    <input type="date" id="event-date">
                    <span class="field-error" id="event-date-error">Seleziona una data.</span>
                </div>
                <div class="form-group">
                    <div class="label-group">
                        <div class="label-icon">
                            <i class="hgi hgi-stroke hgi-rounded hgi-clock-01"></i>
                        </div>
                        <label for="event-time">Ora *</label>
                    </div>
                    <input type="time" id="event-time">
                    <span class="field-error" id="event-time-error">Seleziona un orario.</span>
                </div>
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                    </div>
                    <label for="event-location">Luogo *</label>
                </div>
                <input type="text" id="event-location" placeholder="es. Bar Mediterraneo o link Maps">
                <span class="field-error" id="event-location-error">Inserisci il luogo dell'evento.</span>
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-user-group"></i>
                    </div>
                    <label for="event-max-participants">Partecipanti max *</label>
                </div>
                <input type="number" id="event-max-participants" inputmode="numeric" min="2" placeholder="es. 10">
                <span class="field-error" id="event-max-participants-error">Inserisci il numero massimo di partecipanti
                    (min. 2).</span>
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-text-font"></i>
                    </div>
                    <label for="event-description">Descrizione <span>(opzionale)</span></label>
                </div>
                <input type="text" id="event-description" placeholder="es. Portate qualcosa da bere!">
            </div>
            <div class="form-actions">
                <button type="button" class="btn-primary" id="submitBtn">Crea Evento</button>
                <a href="events.html" class="btn-cancel">Annulla</a>
            </div>
        </form>
    </div>
    <script src="js/create-event.js"></script>
</body>

</html>
