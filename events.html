<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/events.css">
    <title>Eventi</title>
</head>

<body>
    <div class="app-events">
        <header class="header">
            <p class="header-title">Scopri gli eventi</p>
            <div class="avatar-circle">M</div>
        </header>
        <nav class="filters">
            <button class="btn-outline">Tutti</button>
            <button class="btn-secondary">Partecipo</button>
            <button class="btn-secondary">Miei</button>
        </nav>
        <main class="card-list">
            <article class="card">
                <h2 class="card-title">Aperitivo Serale</h2>
                <div class="card-info">
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Sab. 12 luglio</p>
                    </div>
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-clock-01"></i>
                        <p>19.30</p>
                    </div>
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Bar Mediterraneo</p>
                    </div>
                </div>
                <div class="card-footer">
                    <span>2 / 10 partecipanti</span>
                    <a href="details.html" class="btn-icon-action" aria-label="Vedi dettagli evento">
                        <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-01"></i>
                    </a>
                </div>
            </article>
            <article class="card">
                <h2 class="card-title">Danza Puzzo</h2>
                <div class="card-info">
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Mer. 18 luglio</p>
                    </div>
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-clock-01"></i>
                        <p>23.30</p>
                    </div>
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Disco Sole</p>
                    </div>
                </div>
                <div class="card-footer">
                    <span>6 / 8 partecipanti</span>
                    <a href="details.html" class="btn-icon-action" aria-label="Vedi dettagli evento">
                        <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-01"></i>
                    </a>
                </div>
            </article>
        </main>
        <footer class="footer">
            <a href="create-event.html" class="btn-icon-action" aria-label="Aggiungi nuovo evento">
                <i class="hgi hgi-stroke hgi-rounded hgi-add-01"></i>
            </a>
        </footer>
    </div>
</body>

</html>
