<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/events.css">
    <title>Eventi</title>
</head>

<body>
    <div class="app-events">
        <header class="page-header">
            <p class="header-title">Scopri gli eventi</p>
            <a href="profile.html" class="avatar-circle">M</a>
        </header>

        <nav class="filters">
            <button class="btn-outline">Tutti</button>
            <button class="btn-secondary">Partecipo</button>
            <button class="btn-secondary">Miei</button>
        </nav>

        <main class="card-list">

            <article class="card">
                <div class="menu-wrapper">
                    <button class="menu-trigger" aria-label="Opzioni" aria-haspopup="true" aria-expanded="false">
                        <i class="hgi hgi-stroke hgi-rounded hgi-more-vertical"></i>
                    </button>
                    <div class="dropdown" role="menu">
                        <button class="menu-item" role="menuitem">
                            <i class="hgi hgi-stroke hgi-rounded hgi-pen-01"></i>
                            Modifica
                        </button>
                        <div class="divider"></div>
                        <button class="menu-item delete" role="menuitem">
                            <i class="hgi hgi-stroke hgi-rounded hgi-delete-02"></i>
                            Elimina
                        </button>
                    </div>
                </div>

                <div class="card-top">
                    <h2 class="card-title">Aperitivo Serale</h2>
                    <span class="card-status status-open">Posti liberi</span>
                </div>

                <div class="card-info">
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Sab. 12 luglio &middot; <strong>19.30</strong></p>
                    </div>
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Bar Mediterraneo</p>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="attendees">
                        <div class="avatar-stack">
                            <span class="avatar-circle">L</span>
                            <span class="avatar-circle">G</span>
                        </div>
                        <span class="attendees-count">2 / 10</span>
                    </div>
                    <div class="card-actions">
                        <a href="details.html" class="btn-icon-action primary" aria-label="Vedi dettagli evento">
                            <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-01"></i>
                        </a>
                    </div>
                </div>
            </article>

            <article class="card">
                <div class="menu-wrapper">
                    <button class="menu-trigger" aria-label="Opzioni" aria-haspopup="true" aria-expanded="false">
                        <i class="hgi hgi-stroke hgi-rounded hgi-more-vertical"></i>
                    </button>
                    <div class="dropdown" role="menu">
                        <button class="menu-item" role="menuitem">
                            <i class="hgi hgi-stroke hgi-rounded hgi-pen-01"></i>
                            Modifica
                        </button>
                        <div class="divider"></div>
                        <button class="menu-item delete" role="menuitem">
                            <i class="hgi hgi-stroke hgi-rounded hgi-delete-02"></i>
                            Elimina
                        </button>
                    </div>
                </div>

                <div class="card-top">
                    <h2 class="card-title">Danza Puzzo</h2>
                    <span class="card-status status-almost">Quasi pieno</span>
                </div>

                <div class="card-info">
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Mer. 18 luglio &middot; <strong>23.30</strong></p>
                    </div>
                    <div class="info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Disco Sole</p>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="attendees">
                        <div class="avatar-stack">
                            <span class="avatar-circle">A</span>
                            <span class="avatar-circle">P</span>
                            <span class="avatar-circle">M</span>
                            <span class="avatar-circle avatar-more">+3</span>
                        </div>
                        <span class="attendees-count">6 / 8</span>
                    </div>
                    <div class="card-actions">
                        <a href="details.html" class="btn-icon-action primary" aria-label="Vedi dettagli evento">
                            <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-01"></i>
                        </a>
                    </div>
                </div>
            </article>

        </main>

        <footer class="page-footer">
            <a href="create-event.html" class="btn-icon-action" aria-label="Aggiungi nuovo evento">
                <i class="hgi hgi-stroke hgi-rounded hgi-add-01"></i>
            </a>
        </footer>
    </div>

    <script>
        document.querySelectorAll('.menu-wrapper').forEach(wrapper => {
            const trigger = wrapper.querySelector('.menu-trigger');
            const dropdown = wrapper.querySelector('.dropdown');

            function toggleMenu(open) {
                trigger.classList.toggle('open', open);
                dropdown.classList.toggle('open', open);
                trigger.setAttribute('aria-expanded', open);
            }

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = dropdown.classList.contains('open');
                closeAllMenus();
                toggleMenu(!isOpen);
            });
        });

        function closeAllMenus() {
            document.querySelectorAll('.menu-trigger').forEach(trig => trig.classList.remove('open'));
            document.querySelectorAll('.dropdown').forEach(drop => drop.classList.remove('open'));
            document.querySelectorAll('.menu-trigger').forEach(trig => trig.setAttribute('aria-expanded', 'false'));
        }

        document.addEventListener('click', closeAllMenus);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAllMenus();
        });
    </script>
</body>

</html>
