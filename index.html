<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Login</title>
</head>

<body>
    <div class="app-login">
        <form class="form" onsubmit="return false;">
            <div class="form-header">
                <h1>Ciao! 👋🏻</h1>
                <p>Scegli un nickname e aggiungi i tuoi contatti (visibili solo ai partecipanti dei tuoi eventi).</p>
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-user"></i>
                    </div>
                    <label for="nickname">Nickname *</label>
                </div>
                <input type="text" id="nickname" placeholder="es. Marco_92" required maxlength="15">
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-whatsapp"></i>
                    </div>
                    <label for="whatsapp">Whatsapp <span>(opzionale)</span></label>
                </div>
                <input type="text" id="whatsapp" inputmode="numeric" pattern="[0-9]*" placeholder="328 333 ...">
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-instagram"></i>
                    </div>
                    <label for="instagram">Instagram <span>(opzionale)</span></label>
                </div>
                <input type="text" id="instagram" placeholder="@username">
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-telegram"></i>
                    </div>
                    <label for="telegram">Telegram <span>(opzionale)</span></label>
                </div>
                <input type="text" id="telegram" placeholder="@username">
            </div>
            <a href="events.html" class="btn-primary">Entra</a>
        </form>
    </div>
</body>

</html>
