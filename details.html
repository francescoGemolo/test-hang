<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <div class="app-details">
        <div class="details-header">
            <i class="hgi hgi-stroke hgi-rounded hgi-arrow-left-02"></i>
        </div>
        <div class="details-wrapper">
            <h1 class="detail-title">Aperitivo Serale</h1>
            <div class="details-card">
                <div class="details-info">

                    <div class="details-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Sab. 12 luglio</p>
                    </div>
                    <div class="details-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-clock-01"></i>
                        <p>19:30</p>
                    </div>

                    <div class="details-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Bar Mediterraneo</p>
                    </div>

                    <div class="details-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-user-group"></i>
                        <p>2 / 10 partecipanti</p>
                    </div>

                </div>

                <div class="details-description">
                    <p>
                        Apericucciole con le cucciole.
                    </p>
                </div>
            </div>
            <button class="details-btn">Partecipa</button>

            <!-- CHAT -->
            <div class="details-participants">
                <h2 class="details-participants-title">
                    Partecipanti (2)
                </h2>

                <div class="details-participant">

                    <div class="details-participant-avatar">
                        M
                    </div>

                    <div class="details-participant-content">

                        <div class="details-participant-header">
                            <h3>Marco</h3>
                            <p>- Organizzatore</p>
                        </div>

                        <div class="details-participant-links">
                            <a href="#" class="details-link details-link-whatsapp">
                                <i class="hgi hgi-stroke hgi-rounded hgi-whatsapp"></i>
                                +39 333 1234567
                            </a>

                            <a href="#" class="details-link details-link-instagram">
                                <i class="hgi hgi-stroke hgi-rounded hgi-instagram"></i>
                                marco_roma
                            </a>
                        </div>

                    </div>

                </div>

                <div class="details-participant">

                    <div class="details-participant-avatar">
                        G
                    </div>

                    <div class="details-participant-content">

                        <div class="details-participant-header">
                            <h3>Giulia</h3>
                        </div>

                        <div class="details-participant-links">
                            <a href="#" class="details-link details-link-instagram">
                                <i class="hgi hgi-stroke hgi-rounded hgi-instagram"></i>
                                giulia.foto
                            </a>

                            <a href="#" class="details-link details-link-telegram">
                                <i class="hgi hgi-stroke hgi-rounded hgi-telegram"></i>
                                giulia_tg
                            </a>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

</body>

</html>
