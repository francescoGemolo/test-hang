<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <div class="app-events">
        <div class="events-header">
            <div class="events-header-icon">
                <i class="hgi hgi-stroke hgi-rounded hgi-calendar-add-01"></i>
                <a href="events.html">Eventi</a>
            </div>
            <div class="events-header-avatar">
                <i class="hgi hgi-stroke hgi-rounded hgi-user"></i>
            </div>
        </div>
        <div class="events-cta-group">
            <button class="btn events-cta-active">Tutti</button>
            <button class="btn events-cta">Partecipo</button>
            <button class="btn events-cta">Miei</button>
        </div>
        <div class="events-cards">
            <!-- Card - 1 -->
            <div class="events-card">
                <h2 class="events-card-title">Aperitivo Serale</h2>
                <div class="events-card-info">
                    <div class="events-card-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Sab. 12 luglio</p>
                    </div>
                    <div class="events-card-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-clock-01"></i>
                        <p>19.30</p>
                    </div>
                    <div class="events-card-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Bar Mediterraneo</p>
                    </div>
                </div>
                <div class="events-participants">
                    2 / 10 partecipanti
                    <!-- Icon -->
                    <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-01"></i>
                </div>
            </div>
            <!-- Card - 2 -->
            <div class="events-card">
                <h2 class="events-card-title">Danza Puzzo</h2>
                <div class="events-card-info">
                    <div class="events-card-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-calendar-05"></i>
                        <p>Mer. 18 luglio</p>
                    </div>
                    <div class="events-card-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-clock-01"></i>
                        <p>23.30</p>
                    </div>
                    <div class="events-card-info-group">
                        <i class="hgi hgi-stroke hgi-rounded hgi-pin-location-01"></i>
                        <p>Disco Sole</p>
                    </div>
                </div>
                <div class="events-participants">
                    2 / 8 partecipanti
                    <!-- Icon -->
                    <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-01"></i>
                </div>
            </div>
        </div>
        <div class="events-footer">
                <i class="hgi hgi-stroke hgi-rounded hgi-add-01"></i>
        </div>
    </div>

</body>

</html>
