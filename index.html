<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="app-login">
        <div class="form">
            <div class="form-header">
                <h1>Ciao! 👋🏻</h1>
                <p>Scegli un nickname e aggiungi i tuoi contatti (visibili solo ai partecipanti dei tuoi eventi).</p>
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-user"></i>
                    </div>
                    <label>Nickname *</label>
                </div>
                <input type="text" placeholder="es. Marco_92" required maxlength="15">
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-whatsapp"></i>
                    </div>
                    <label>Whatsapp <span>(opzionale)</span></label>
                </div>
                <input type="text" inputmode="numeric" pattern="[0-9]" placeholder="328 333 ...">
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-instagram"></i>
                    </div>
                    <label>Instagram <span>(opzionale)</span></label>
                </div>
                <input type="text" placeholder="@username">
            </div>
            <div class="form-group">
                <div class="label-group">
                    <div class="label-icon">
                        <i class="hgi hgi-stroke hgi-rounded hgi-telegram"></i>
                    </div>
                    <label>Telegram <span>(opzionale)</span></label>
                </div>
                <input type="text" placeholder="@username">
            </div>
            <a href="events.html" class="btn">Entra</button>
        </div>
    </div>
</body>

</html>
